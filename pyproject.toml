[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockcast"
version = "0.2.0"
description = "Pronóstico de acciones (EE. UU. y BMV) con LightGBM/LSTM, tasas de bancos centrales y noticias, 100% local."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "pyarrow>=14",
    "pyyaml>=6",
    "joblib>=1.3",
    "plotly>=5.20",
    "streamlit>=1.35",
    "matplotlib>=3.8",  # gradientes de color en tablas
    "scipy>=1.11",
]

[project.optional-dependencies]
# LSTM original (más lento, requiere GPU para ser práctico)
deep = ["torch>=2.2"]
# Sentimiento con FinBERT en lugar de VADER (descarga ~400 MB la primera vez)
finbert = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
stockcast = "stockcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
